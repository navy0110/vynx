name: Frontend CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
      NEXT_PUBLIC_SUPABASE_KEY: ci-anon-key
      SUPABASE_SECRET_KEY: ci-server-secret
      NEXT_PUBLIC_TREASURY_WALLET: "11111111111111111111111111111111"
      NEXT_PUBLIC_SOLANA_RPC_URL: https://api.devnet.solana.com
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_PHANTOM_APP_ID: ci-phantom-app-id
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
