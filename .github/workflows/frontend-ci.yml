name: Frontend CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    env:
      SUPABASE_URL: https://ci.supabase.co
      SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SECRET_KEY: ci-server-secret
      NEXT_PUBLIC_TREASURY_WALLET: "11111111111111111111111111111111"
      NEXT_PUBLIC_SOLANA_RPC_URL: https://api.devnet.solana.com
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_PHANTOM_APP_ID: ci-phantom-app-id
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: dtolnay/rust-toolchain@stable
      - name: Build registry for frontend integration tests
        run: |
          curl -fsSL https://release.anza.xyz/v4.1.2/install -o /tmp/agave-install.sh
          sh /tmp/agave-install.sh --no-modify-path v4.1.2
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          npm ci --prefix ../chain
          cd ../chain
          cargo build-sbf --tools-version v1.57 --arch v3
      - run: npm run test:e2e:registry
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: |
            front/playwright-report/
            front/test-results/
          retention-days: 7
